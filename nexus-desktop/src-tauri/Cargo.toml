[package]
name = "app"
version = "0.1.0"
description = "Mi9-Nexus desktop"
authors = ["Mi9"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tiny_http = "0.12"
include_dir = "0.7"
ureq = { version = "2", features = ["charset"] }
dirs = "5"